<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Admin - Support Tickets - Tune Wave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f0f23 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #e0e0e0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-top: 100px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                    radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                    radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 50px 50px, 80px 80px, 120px 120px;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }

        .content-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d4ff, #ffffff, #00d4ff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShimmer 3s ease-in-out infinite;
        }

        @keyframes textShimmer {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .card-body {
            padding: 20px;
        }

        .card-title {
            color: #00d4ff;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .card-text {
            color: #e0e0e0;
        }

        .badge {
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .bg-warning {
            background: linear-gradient(135deg, #ff9f43, #ff7f00) !important;
        }

        .bg-success {
            background: linear-gradient(135deg, #2ed573, #1dd1a1) !important;
        }

        .bg-danger {
            background: linear-gradient(135deg, #ff6b81, #ff4757) !important;
        }

        .bg-info {
            background: linear-gradient(135deg, #00d4ff, #0099cc) !important;
        }

        .bg-secondary {
            background: linear-gradient(135deg, #747d8c, #57606f) !important;
        }

        .table {
            color: #e0e0e0;
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
        }

        .table th {
            background: rgba(255, 255, 255, 0.05);
            color: #00d4ff;
            font-weight: 600;
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        .table tbody tr {
            transition: all 0.3s ease;
        }

        .table tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: white;
            box-shadow: 0 2px 10px rgba(0, 212, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            margin-top: 20px;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .alert {
            border-radius: 10px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            padding: 15px;
        }

        .alert-success {
            border-color: rgba(46, 213, 115, 0.3);
            color: #2ed573;
        }

        .alert-danger {
            border-color: rgba(255, 71, 87, 0.3);
            color: #ff6b81;
        }

        .alert-info {
            border-color: rgba(0, 212, 255, 0.3);
            color: #00d4ff;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-family: 'Monospace', monospace;
            font-size: 28px;
            font-weight: 600;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .auth-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-nav {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-login {
            background: transparent;
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-login:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .btn-signup {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
        }

        @media (max-width: 768px) {
            .navbar {
                width: 95%;
                padding: 12px 20px;
                flex-wrap: wrap;
                gap: 15px;
            }

            .container {
                padding: 20px;
            }

            .content-container {
                padding: 30px 20px;
            }

            .table-responsive {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar">
    <div class="logo">TuneWave</div>
    <div class="auth-buttons">
        <a th:href="@{/users/logout}" class="btn-nav btn-login">Logout</a>
        <a th:href="@{/dashboard/admin}" class="btn-nav btn-signup">⬅ Back</a>
    </div>
</nav>

<div class="container">
    <div class="content-container">
        <h2 class="mb-4">Support Tickets Management</h2>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Statistics</h5>
                <p class="card-text">
                    Total Tickets: <span th:text="${tickets.size()}"></span> |
                    Pending: <span class="badge bg-warning" th:text="${pendingCount}"></span>
                </p>
            </div>
        </div>

        <div th:if="${tickets.empty}">
            <div class="alert alert-info">No support tickets found.</div>
        </div>

        <div th:unless="${tickets.empty}" class="table-responsive">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Complaint ID</th>
                    <th>User</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Message</th>
                    <th>Status</th>
                    <th>Created Date</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ticket : ${tickets}">
                    <td th:text="${ticket.complaintId}"></td>
                    <td th:text="${ticket.user.name}"></td>
                    <td th:text="${ticket.user.email}"></td>
                    <td th:text="${ticket.userRole}"></td>
                    <td th:text="${#strings.abbreviate(ticket.message, 50)}"></td>
                    <td>
                                <span th:switch="${ticket.status}">
                                    <span th:case="RESOLVED" class="badge bg-success" th:text="${ticket.status}"></span>
                                    <span th:case="PENDING" class="badge bg-warning" th:text="${ticket.status}"></span>
                                    <span th:case="NOT_RESOLVED" class="badge bg-danger" th:text="${ticket.status}"></span>
                                    <span th:case="IN_PROGRESS" class="badge bg-info" th:text="${ticket.status}"></span>
                                    <span th:case="CLOSED" class="badge bg-secondary" th:text="${ticket.status}"></span>
                                    <span th:case="*" class="badge bg-secondary" th:text="${ticket.status}"></span>
                                </span>
                    </td>
                    <td th:text="${#temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <a th:href="@{/tickets/admin/details/{id}(id=${ticket.ticketId})}"
                           class="btn btn-sm btn-primary">View/Update</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <a th:href="@{/dashboard/admin}">
            <button type="button" class="btn btn-back">⬅ Back to Dashboard</button>
        </a>
    </div>
</div>
</body>
</html>
