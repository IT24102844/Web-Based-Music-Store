<!DOCTYPE html>
    <title>User Management - Tune Wave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f0f23 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-top: 100px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                    radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                    radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 50px 50px, 80px 80px, 120px 120px;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        .content-container {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #00d4ff, #ffffff, #00d4ff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShimmer 3s ease-in-out infinite;
            text-align: center;
        }

        @keyframes textShimmer {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .stats-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            flex: 1;
            min-width: 180px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #b0b0b0;
        }

        .table-container {
            background: rgba(15, 23, 42, 0.9);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 25px;
        }

        .table {
            color: #ffffff;
            margin-bottom: 0;
            border-collapse: separate;
            border-spacing: 0;
        }

        .table thead th {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            font-weight: 600;
            padding: 18px 15px;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .table tbody td {
            padding: 16px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
            background: rgba(255, 255, 255, 0.02);
        }

        .table tbody tr {
            transition: all 0.3s ease;
        }

        .table tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.005);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .user-details {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: 600;
            color: #ffffff;
        }

        .user-email {
            font-size: 0.85rem;
            color: #b0b0b0;
        }

        .role-badge, .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .role-badge {
            background: rgba(0, 212, 255, 0.15);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .status-badge.active {
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
            border: 1px solid rgba(46, 213, 115, 0.3);
        }

        .status-badge.inactive {
            background: rgba(255, 159, 67, 0.15);
            color: #ff9f43;
            border: 1px solid rgba(255, 159, 67, 0.3);
        }

        .status-badge.suspended {
            background: rgba(255, 107, 129, 0.15);
            color: #ff6b81;
            border: 1px solid rgba(255, 107, 129, 0.3);
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 200px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
            gap: 6px;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b81, #ff4757);
            color: white;
            box-shadow: 0 2px 10px rgba(255, 107, 129, 0.3);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 107, 129, 0.4);
        }

        .btn-danger.disabled {
            background: rgba(255, 255, 255, 0.1);
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #ffffff;
            padding: 8px 12px;
            font-size: 0.85rem;
            width: 100%;
        }

        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #00d4ff;
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(0, 212, 255, 0.25);
            outline: none;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-label {
            color: #b0b0b0;
            font-size: 0.8rem;
            margin-bottom: 5px;
            display: block;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .success-message, .error-message {
            border-radius: 10px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .success-message {
            border-color: rgba(46, 213, 115, 0.3);
            background: rgba(46, 213, 115, 0.1);
        }

        .error-message {
            border-color: rgba(255, 71, 87, 0.3);
            background: rgba(255, 71, 87, 0.1);
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-family: 'Monospace', monospace;
            font-size: 28px;
            font-weight: 600;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .auth-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-nav {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-login {
            background: transparent;
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-login:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .btn-signup {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
        }

        @media (max-width: 992px) {
            .table-container {
                overflow-x: auto;
            }

            .action-buttons {
                min-width: 180px;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                width: 95%;
                padding: 12px 20px;
                flex-wrap: wrap;
                gap: 15px;
            }

            .container {
                padding: 20px;
            }

            .content-container {
                padding: 20px;
            }

            .table thead th, .table tbody td {
                padding: 12px 8px;
            }

            .stats-container {
                flex-direction: column;
            }

            .stat-card {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar">
    <div class="logo">TuneWave</div>
    <div class="auth-buttons">
        <a th:href="@{/users/logout}" class="btn-nav btn-login">Logout</a>
        <a th:href="@{/dashboard/admin}" class="btn-nav btn-signup">⬅ Back</a>
    </div>
</nav>

<div class="container">
    <div class="content-container">
        <h2>User Management</h2>

        <!-- Success/Error Messages -->
        <div th:if="${param.success}" class="success-message">
            <i class="fas fa-check-circle"></i>
            <p th:text="${param.success}">Success message</p>
        </div>
        <div th:if="${param.error}" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            <p th:text="${param.error}">Error message</p>
        </div>

        <!-- Statistics Cards -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-value" th:text="${users.size()}">0</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" th:text="${adminCount}">0</div>
                <div class="stat-label">Administrators</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" th:text="${users.?[status == 'ACTIVE'].size()}">0</div>
                <div class="stat-label">Active Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" th:text="${users.?[status == 'SUSPENDED'].size()}">0</div>
                <div class="stat-label">Suspended Users</div>
            </div>
        </div>

        <!-- Users Table -->
        <div class="table-container">
            <table class="table">
                <thead>
                <tr>
                    <th>User</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td>
                        <div class="user-info">
                            <div class="user-avatar">
                                <span th:text="${user.name.substring(0, 1).toUpperCase()}">U</span>
                            </div>
                            <div class="user-details">
                                <div class="user-name" th:text="${user.name}">User Name</div>
                                <div class="user-email" th:text="${user.email}">user@example.com</div>
                                <small class="text-muted">ID: <span th:text="${user.userId}">1</span></small>
                            </div>
                        </div>
                    </td>
                    <td>
                        <span class="role-badge" th:text="${user.role}">USER</span>
                    </td>
                    <td>
                        <span th:classappend="${'status-badge ' +
                            (user.status == 'ACTIVE' ? 'active' :
                             user.status == 'INACTIVE' ? 'inactive' : 'suspended')}"
                              th:text="${user.status}">ACTIVE</span>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <!-- Delete User Button -->
                            <a th:href="@{'/admin/users/delete/' + ${user.userId}}"
                               th:if="!(${user.role == 'ADMIN'} and ${adminCount <= 1})"
                               class="btn btn-danger"
                               onclick="return confirm('Are you sure you want to delete this user?')">
                                <i class="fas fa-trash"></i> Delete User
                            </a>

                            <!-- Disabled delete button for last admin -->
                            <span th:if="${user.role == 'ADMIN'} and ${adminCount <= 1}"
                                  class="btn btn-danger disabled"
                                  title="Cannot delete the last admin">
                                <i class="fas fa-trash"></i> Delete User
                            </span>

                            <!-- Role Change Form -->
                            <div class="form-group">
                                <label class="form-label">Change Role:</label>
                                <form th:action="@{'/admin/users/role/' + ${user.userId}}" method="post" class="d-flex gap-2">
                                    <select name="role" class="form-select">
                                        <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option>
                                        <option value="CUSTOMER" th:selected="${user.role == 'CUSTOMER'}">CUSTOMER</option>
                                        <option value="ARTIST" th:selected="${user.role == 'ARTIST'}">ARTIST</option>
                                        <option value="ITEM_SELLER" th:selected="${user.role == 'ITEM_SELLER'}">ITEM_SELLER</option>
                                        <option value="COURSE_SELLER" th:selected="${user.role == 'COURSE_SELLER'}">COURSE_SELLER</option>
                                    </select>
                                    <button type="submit" class="btn btn-action">
                                        <i class="fas fa-sync-alt"></i>
                                    </button>
                                </form>
                            </div>

                            <!-- Status Change Form -->
                            <div class="form-group">
                                <label class="form-label">Change Status:</label>
                                <form th:action="@{'/admin/users/status/' + ${user.userId}}" method="post" class="d-flex gap-2">
                                    <select name="status" class="form-select">
                                        <option value="ACTIVE" th:selected="${user.status == 'ACTIVE'}">ACTIVE</option>
                                        <option value="INACTIVE" th:selected="${user.status == 'INACTIVE'}">INACTIVE</option>
                                        <option value="SUSPENDED" th:selected="${user.status == 'SUSPENDED'}">SUSPENDED</option>
                                    </select>
                                    <button type="submit" class="btn btn-action">
                                        <i class="fas fa-sync-alt"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <a th:href="@{/dashboard/admin}">
            <button type="button" class="btn btn-back">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </button>
        </a>
    </div>
</div>
</body>
</html>
