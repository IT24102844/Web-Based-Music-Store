<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - TuneWave</title>
    <link th:href="@{/css/seller-theme.css}" rel="stylesheet">
</head>
<body>
<div class="dashboard-container">
    <nav class="sidebar">
        <h2>🎵 TuneWave</h2>
        <ul>
            <li><a th:href="@{/buyer/dashboard}">Shop</a></li>
            <li><a th:href="@{/buyer/products}">Browse</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <div class="header">
            <h1>Your Cart</h1>
        </div>

        <form th:action="@{/buyer/cart/update}" method="post">
            <div class="card" th:if="${items != null and !#lists.isEmpty(items)}">
                <div style="display:grid; grid-template-columns: 1fr 100px 120px 100px; align-items:center; gap:12px; margin-bottom:12px;">
                    <div style="font-weight:600;">Items</div>
                    <div style="font-weight:700;">Qty</div>
                    <div style="font-weight:700; text-align:right;">Price</div>
                    <div style="width:100px;"></div>
                </div>

                <div th:each="ci : ${items}" class="cart-row" style="display:grid; grid-template-columns: 1fr 100px 120px 100px; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #eee;">
                    <label style="display:flex; align-items:center; gap:12px;">
                        <input type="checkbox" name="selectedIds" th:value="${ci.product.id}" class="cart-select" onchange="recalcSelected()">
                        <div style="width:64px; height:64px; border-radius:8px; overflow:hidden; background:#f8fafc; flex:0 0 auto;">
                            <img th:if="${ci.product.getPrimaryImageUrl()}" th:src="${ci.product.getPrimaryImageUrl()}" alt="Product Image" style="width:100%; height:100%; object-fit:cover;">
                            <div th:unless="${ci.product.getPrimaryImageUrl()}" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#64748b; font-size:0.9rem;">🎵</div>
                        </div>
                        <div>
                            <div style="font-weight:600;" th:text="${ci.product.name}">Product</div>
                            <div style="color:#64748b;" th:text="${ci.product.instrumentType}">Type</div>
                        </div>
                    </label>

                    <div style="display:flex; align-items:center;">
                        <input type="hidden" name="productId" th:value="${ci.product.id}">
                        <input type="number" name="quantity" th:value="${ci.quantity}" min="1" style="width:80px;" class="cart-qty" th:attr="data-price=${ci.product.price}" oninput="recalcSelected()">
                    </div>

                    <div style="font-weight:700; color:#059669; text-align:right;" th:text="'LKR ' + ${#numbers.formatDecimal(ci.product.price * ci.quantity, 1, 2)}">LKR 0.00</div>

                    <div style="text-align:right;">
                        <button type="submit"
                                class="btn btn-secondary"
                                th:formaction="@{'/buyer/cart/remove/' + ${ci.product.id}}"
                                formmethod="post">Remove</button>
                    </div>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:12px;">
                    <div>
                        <div style="font-weight:800;">Cart Total</div>
                        <div style="color:#64748b; font-size:0.9rem;">Selected Subtotal: <span id="selectedSubtotal" style="font-weight:700; color:#059669;">$0.00</span></div>
                    </div>
                    <div style="font-weight:800; color:#059669;" th:text="'LKR ' + ${#numbers.formatDecimal(total, 1, 2)}">LKR 0.00</div>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:12px;">
                    <button type="submit" class="btn btn-secondary">Update Cart</button>
                    <div style="margin:0; display:flex; align-items:center; gap:10px;">
                        <span id="selectedCountLabel" style="color:#64748b;">0 selected</span>
                        <button type="submit" class="btn btn-primary" id="checkoutBtn" disabled
                                th:formaction="@{/buyer/cart/checkout}" formmethod="post">Checkout Selected →</button>
                    </div>
                </div>
            </div>

            <div th:if="${items == null or #lists.isEmpty(items)}" style="text-align:center; padding:60px; color:#64748b;">
                <div style="font-size:4rem; margin-bottom:16px;">🛒</div>
                <h3 style="margin-bottom:8px; color:#374151;">Your cart is empty</h3>
                <a th:href="@{/buyer/products}" class="btn btn-primary">Browse Products</a>
            </div>
        </form>
    </main>
  </div>

  <script>
    if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark-mode');
    }

    function formatCurrency(num) {
        try { return 'LKR ' + Number(num).toFixed(2); } catch(e) { return 'LKR 0.00'; }
    }

    function recalcSelected() {
        const rows = document.querySelectorAll('.cart-row');
        let subtotal = 0;
        let count = 0;
        rows.forEach(row => {
            const cb = row.querySelector('.cart-select');
            const qtyEl = row.querySelector('.cart-qty');
            const price = parseFloat(qtyEl?.dataset?.price || '0');
            const qty = Math.max(1, parseInt(qtyEl?.value || '1', 10));
            if (cb && cb.checked) {
                subtotal += price * qty;
                count += 1;
            }
        });
        const subtotalEl = document.getElementById('selectedSubtotal');
        const countLabel = document.getElementById('selectedCountLabel');
        const checkoutBtn = document.getElementById('checkoutBtn');
        if (subtotalEl) subtotalEl.textContent = formatCurrency(subtotal);
        if (countLabel) countLabel.textContent = count + ' selected';
        if (checkoutBtn) checkoutBtn.disabled = count === 0;
    }

    // Initialize with 0 selected subtotal
    window.addEventListener('load', recalcSelected);
  </script>
</body>
</html>
