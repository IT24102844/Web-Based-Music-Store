<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - TuneWave</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/seller-theme.css}" rel="stylesheet">
</head>
<body>
<div class="dashboard-container">
    <!-- Sidebar -->
    <nav class="sidebar">
        <h2>TuneWave</h2>
        
        <!-- Profile Section -->
        <div class="profile-section">
            <div class="profile-image-container">
                <img th:if="${user.profileImagePath}" 
                     th:src="'/uploads/profile/' + ${user.profileImagePath}" 
                     th:alt="${user.name} + ' Profile Image'" 
                     class="profile-image"
                     onerror="this.src='https://via.placeholder.com/80x80/2333de/ffffff?text=' + this.alt.charAt(0)">
                <img th:unless="${user.profileImagePath}" 
                     src="https://via.placeholder.com/80x80/2333de/ffffff?text=U" 
                     alt="Default Profile Image" 
                     class="profile-image">
            </div>
            <div class="profile-info">
                <div class="profile-name" th:text="${user.name}">User Name</div>
                <div class="profile-role" th:text="${user.role}">USER</div>
                <div class="profile-details">
                    <p><strong>Email:</strong> <span th:text="${user.email}">user@example.com</span></p>
                    <p><strong>Status:</strong> <span th:text="${user.status}">ACTIVE</span></p>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <ul>
            <li><a th:href="@{/users/edit-profile}" class="active">Edit Profile</a></li>
            <li><a th:href="@{/users/logout}" class="logout">Logout</a></li>
        </ul>

        <!-- Theme Toggle -->
        <div class="theme-toggle">
            <span class="theme-toggle-label">Theme</span>
            <div class="toggle-switch" onclick="toggleTheme()"></div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <h1>Edit Profile</h1>
            <p>Update your personal information and account settings</p>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${success}" class="message success" th:text="${success}"></div>
        <div th:if="${error}" class="message error" th:text="${error}"></div>

        <!-- Profile Form -->
        <div class="card">
            <h2>Profile Information</h2>
            <form th:action="@{/users/update-profile}" th:object="${user}" method="post">
                <input type="hidden" th:field="*{userId}"/>

                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" required/>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" readonly/>
                    <small style="color: #64748b; font-size: 0.85rem;">Email cannot be changed</small>
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" required/>
                    <small style="color: #64748b; font-size: 0.85rem;">Enter your current password to confirm changes</small>
                </div>

                <div class="form-group">
                    <label for="role">Role</label>
                    <input type="text" id="role" th:field="*{role}" class="form-control" readonly/>
                    <small style="color: #64748b; font-size: 0.85rem;">Role cannot be changed</small>
                </div>

                <button type="submit" class="btn">Update Profile</button>
            </form>
        </div>
    </main>
</div>

<script>
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }

    // Load saved theme preference immediately to prevent flashing
    (function() {
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    })();
</script>
</body>
</html>
