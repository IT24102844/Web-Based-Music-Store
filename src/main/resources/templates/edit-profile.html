<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit Profile - Tune Wave</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f0f23 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: #e0e0e0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding-top: 100px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
              radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
              radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
              radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
      background-size: 50px 50px, 80px 80px, 120px 120px;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 800px;
      margin: 0 auto;
      padding: 30px;
    }

    .form-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .form-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0, 212, 255, 0.2);
    }

    h2 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 30px;
      background: linear-gradient(135deg, #00d4ff, #ffffff, #00d4ff);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: textShimmer 3s ease-in-out infinite;
      text-align: center;
    }

    @keyframes textShimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .form-label {
      color: #e0e0e0;
      font-weight: 500;
      margin-bottom: 8px;
      display: block;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #e0e0e0;
      padding: 12px 15px;
      margin-bottom: 20px;
      width: 100%;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: #00d4ff;
      color: #e0e0e0;
      box-shadow: 0 0 0 0.25rem rgba(0, 212, 255, 0.25);
      outline: none;
    }

    .form-control::placeholder {
      color: #888;
    }

    .form-control[readonly] {
      background: rgba(255, 255, 255, 0.05);
      color: #888;
      cursor: not-allowed;
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 30px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      color: white;
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
    }

    .btn-outline-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e0e0e0;
    }

    .btn-outline-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #00d4ff;
      color: #00d4ff;
    }

    .btn-full {
      width: 100%;
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1200px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .logo {
      font-family: 'Monospace', monospace;
      font-size: 28px;
      font-weight: 600;
      color: #00d4ff;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }

    .auth-buttons {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .user-email {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-weight: 500;
    }

    .logout-btn {
      background: rgba(255, 71, 87, 0.2);
      border: 1px solid rgba(255, 71, 87, 0.4);
      color: #ff6b81 !important;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 500;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .logout-btn:hover {
      background: rgba(255, 71, 87, 0.3);
      border-color: #ff4757;
      color: #ff4757 !important;
    }

    .role-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-left: 10px;
      text-transform: uppercase;
    }

    .role-admin {
      background: linear-gradient(135deg, #ff6b81, #ff4757);
      color: white;
    }

    .role-customer {
      background: linear-gradient(135deg, #2ed573, #1dd1a1);
      color: white;
    }

    .role-artist {
      background: linear-gradient(135deg, #ff9f43, #ff7f00);
      color: white;
    }

    .role-item_seller {
      background: linear-gradient(135deg, #3742fa, #5352ed);
      color: white;
    }

    .role-course_seller {
      background: linear-gradient(135deg, #a55eea, #8854d0);
      color: white;
    }

    .section-title {
      color: #00d4ff;
      font-size: 1.3rem;
      margin: 30px 0 20px 0;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .artist-fields {
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid rgba(0, 212, 255, 0.1);
      border-radius: 15px;
      padding: 25px;
      margin: 25px 0;
    }

    .alert {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      color: #e0e0e0;
      padding: 15px;
      margin-bottom: 20px;
    }

    .alert-success {
      border-color: rgba(46, 213, 115, 0.3);
      background: rgba(46, 213, 115, 0.1);
    }

    .alert-danger {
      border-color: rgba(255, 71, 87, 0.3);
      background: rgba(255, 71, 87, 0.1);
    }

    @media (max-width: 768px) {
      .navbar {
        width: 95%;
        padding: 12px 20px;
        flex-wrap: wrap;
        gap: 15px;
      }

      .container {
        padding: 20px;
      }

      .form-container {
        padding: 30px 20px;
      }

      .auth-buttons {
        flex-wrap: wrap;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
<!-- Navigation -->
<nav class="navbar">
  <div class="logo">TuneWave</div>
  <div class="auth-buttons">
    <div th:if="${currentUser != null}" class="d-flex align-items-center">
      <span class="user-email me-3">
        <i class="fas fa-user me-1"></i>
        <span th:text="${currentUser.email}"></span>
      </span>
      <a class="logout-btn" th:href="@{/users/logout}">
        <i class="fas fa-sign-out-alt me-1"></i>Logout
      </a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="form-container">
    <h2>
      Edit Profile
      <span th:if="${user.role == 'ARTIST'}" class="role-badge role-artist">
        <i class="fas fa-music me-1"></i>ARTIST
      </span>
      <span th:if="${user.role == 'ADMIN'}" class="role-badge role-admin">ADMIN</span>
      <span th:if="${user.role == 'CUSTOMER'}" class="role-badge role-customer">CUSTOMER</span>
      <span th:if="${user.role == 'ITEM_SELLER'}" class="role-badge role-item_seller">ITEM_SELLER</span>
      <span th:if="${user.role == 'COURSE_SELLER'}" class="role-badge role-course_seller">COURSE_SELLER</span>
    </h2>

    <!-- Success/Error Messages -->
    <div th:if="${param.success}" class="alert alert-success">
      <i class="fas fa-check-circle me-2"></i>
      <span th:text="${param.success}"></span>
    </div>

    <div th:if="${error}" class="alert alert-danger">
      <i class="fas fa-exclamation-triangle me-2"></i>
      <span th:text="${error}"></span>
    </div>

    <form th:action="@{/users/update-profile}" method="post">
      <!-- Hidden fields -->
      <input type="hidden" name="userId" th:value="${user.userId}"/>
      <input type="hidden" name="email" th:value="${user.email}"/>
      <input type="hidden" name="role" th:value="${user.role}"/>

      <!-- Basic Information -->
      <h4 class="section-title">
        <i class="fas fa-user me-2"></i>Basic Information
      </h4>

      <div class="row">
        <div class="col-md-6">
          <label class="form-label">Full Name:</label>
          <input type="text" name="name" class="form-control"
                 th:value="${user.name}"
                 placeholder="Enter your full name" required/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email:</label>
          <input type="email" th:value="${user.email}" class="form-control" readonly/>
          <small style="color: #888; font-size: 0.8rem;">Email cannot be changed</small>
        </div>
      </div>

      <!-- Artist Specific Fields -->
      <div th:if="${user.role == 'ARTIST'}" class="artist-fields">
        <h4 class="section-title">
          <i class="fas fa-music me-2"></i>Artist Information
        </h4>

        <div class="row">
          <div class="col-md-6">
            <label class="form-label">Stage Name:</label>
            <input type="text" name="stageName" class="form-control"
                   th:value="${stageName}"
                   placeholder="Enter your stage name" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Music Genre:</label>
            <input type="text" name="genre" class="form-control"
                   th:value="${genre}"
                   placeholder="e.g., Rock, Pop, Jazz, Classical" required/>
          </div>
        </div>
      </div>

      <!-- Security -->
      <h4 class="section-title">
        <i class="fas fa-lock me-2"></i>Security
      </h4>

      <div class="row">
        <div class="col-12">
          <label class="form-label">New Password (optional):</label>
          <input type="password" name="password" class="form-control"
                 placeholder="Enter new password (leave blank to keep current)"/>
          <small style="color: #888; font-size: 0.8rem; display: block; margin-top: 5px;">
            Must be at least 6 characters long. Leave blank if you don't want to change your password.
          </small>
        </div>
      </div>

      <!-- Read-only Information -->
      <h4 class="section-title">
        <i class="fas fa-info-circle me-2"></i>Account Information
      </h4>

      <div class="row">
        <div class="col-md-6">
          <label class="form-label">Role:</label>
          <input type="text" th:value="${user.role}" class="form-control" readonly/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Member Since:</label>
          <input type="text" class="form-control"
                 th:value="${#temporals.format(user.createdAt, 'MMM dd, yyyy')}" readonly/>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="row mt-4">
        <div class="col-12">
          <div class="d-flex gap-3">
            <button type="submit" class="btn btn-primary flex-fill">
              <i class="fas fa-save me-2"></i>Update Profile
            </button>
            <a th:href="@{/dashboard/artist}" class="btn btn-outline-secondary">
              <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
            </a>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
  // Add form validation
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('form');
    const passwordField = document.querySelector('input[name="password"]');

    form.addEventListener('submit', function(e) {
      // Validate password length if provided
      const password = passwordField.value;
      if (password && password.length < 6) {
        e.preventDefault();
        alert('Password must be at least 6 characters long');
        passwordField.focus();
        return false;
      }

      // Validate artist fields if user is artist
      const role = '[[${user.role}]]';
      if (role === 'ARTIST') {
        const stageName = document.querySelector('input[name="stageName"]').value;
        const genre = document.querySelector('input[name="genre"]').value;

        if (!stageName || stageName.trim() === '') {
          e.preventDefault();
          alert('Stage name is required');
          document.querySelector('input[name="stageName"]').focus();
          return false;
        }

        if (!genre || genre.trim() === '') {
          e.preventDefault();
          alert('Genre is required');
          document.querySelector('input[name="genre"]').focus();
          return false;
        }
      }

      return true;
    });
  });
</script>
</body>
</html>
