<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit Profile - Tune Wave</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f0f23 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: #e0e0e0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding-top: 100px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
              radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
              radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
              radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
      background-size: 50px 50px, 80px 80px, 120px 120px;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 600px;
      margin: 0 auto;
      padding: 30px;
    }

    .form-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    h2 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 30px;
      background: linear-gradient(135deg, #00d4ff, #ffffff, #00d4ff);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: textShimmer 3s ease-in-out infinite;
      text-align: center;
    }

    @keyframes textShimmer {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    .form-label {
      color: #e0e0e0;
      font-weight: 500;
      margin-bottom: 8px;
      display: block;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #e0e0e0;
      padding: 12px 15px;
      margin-bottom: 20px;
      width: 100%;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: #00d4ff;
      color: #e0e0e0;
      box-shadow: 0 0 0 0.25rem rgba(0, 212, 255, 0.25);
      outline: none;
    }

    .form-control::placeholder {
      color: #888;
    }

    .form-control[readonly] {
      background: rgba(255, 255, 255, 0.05);
      color: #888;
      cursor: not-allowed;
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 30px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      color: white;
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
    }

    .btn-full {
      width: 100%;
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1200px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .logo {
      font-family: 'Monospace', monospace;
      font-size: 28px;
      font-weight: 600;
      color: #00d4ff;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }

    .auth-buttons {
      display: flex;
      gap: 15px;
    }

    .btn-nav {
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      font-family: 'Roboto', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-login {
      background: transparent;
      color: #e0e0e0;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-login:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #00d4ff;
      color: #00d4ff;
    }

    .btn-signup {
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      color: white;
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
    }

    .btn-signup:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
    }

    .role-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-left: 10px;
      text-transform: uppercase;
    }

    .role-admin {
      background: linear-gradient(135deg, #ff6b81, #ff4757);
      color: white;
    }

    .role-customer {
      background: linear-gradient(135deg, #2ed573, #1dd1a1);
      color: white;
    }

    .role-artist {
      background: linear-gradient(135deg, #ff9f43, #ff7f00);
      color: white;
    }

    .role-item_seller {
      background: linear-gradient(135deg, #3742fa, #5352ed);
      color: white;
    }

    .role-course_seller {
      background: linear-gradient(135deg, #a55eea, #8854d0);
      color: white;
    }

    @media (max-width: 768px) {
      .navbar {
        width: 95%;
        padding: 12px 20px;
        flex-wrap: wrap;
        gap: 15px;
      }

      .container {
        padding: 20px;
      }

      .form-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar">
  <div class="logo">TuneWave</div>
  <div class="auth-buttons">
    <a th:href="@{/users/logout}" class="btn-nav btn-login">Logout</a>

    <!-- Dynamic Back Button - Convert role to lowercase and replace underscores with hyphens -->
    <th:block th:with="dashboardRole=${#strings.toLowerCase(#strings.replace(user.role, '_', '-'))}">
      <a th:href="@{'/dashboard/' + ${dashboardRole}}" class="btn-nav btn-signup">⬅ Back to Dashboard</a>
    </th:block>

  </div>
</nav>

<div class="container">
  <div class="form-container">
    <h2>
      Edit Profile
      <!-- Display role badge -->
      <span th:if="${user.role == 'ADMIN'}" class="role-badge role-admin">ADMIN</span>
      <span th:if="${user.role == 'CUSTOMER'}" class="role-badge role-customer">CUSTOMER</span>
      <span th:if="${user.role == 'ARTIST'}" class="role-badge role-artist">ARTIST</span>
      <span th:if="${user.role == 'ITEM_SELLER'}" class="role-badge role-item_seller">ITEM_SELLER</span>
      <span th:if="${user.role == 'COURSE_SELLER'}" class="role-badge role-course_seller">COURSE_SELLER</span>
    </h2>

    <!-- Debug: Show the actual role value and converted dashboard role -->
    <div style="display: none; color: #ff6b81; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin-bottom: 20px;">
      Debug - User Role: <span th:text="${user.role}">Unknown</span><br>
      Debug - Dashboard Role: <span th:text="${#strings.toLowerCase(#strings.replace(user.role, '_', '-'))}">Unknown</span>
    </div>

    <form th:action="@{/users/update-profile}" th:object="${user}" method="post">
      <input type="hidden" th:field="*{userId}"/>

      <div class="mb-3">
        <label class="form-label">Name:</label>
        <input type="text" th:field="*{name}" class="form-control" required/>
      </div>

      <div class="mb-3">
        <label class="form-label">Email:</label>
        <input type="email" th:field="*{email}" class="form-control" readonly/>
      </div>

      <div class="mb-3">
        <label class="form-label">Password (leave blank to keep current password):</label>
        <input type="password" th:field="*{password}" class="form-control" placeholder="Enter new password (optional)"/>
        <small style="color: #e0e0e0; font-size: 0.85rem; display: block; margin-top: 5px; opacity: 0.9;">
          Must be at least 6 characters long
        </small>
      </div>

      <div class="mb-3">
        <label class="form-label">Role:</label>
        <input type="text" th:field="*{role}" class="form-control" readonly/>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Update Profile</button>
    </form>
  </div>
</div>

<script>
  // Add password validation
  document.addEventListener('DOMContentLoaded', function() {
    const passwordField = document.querySelector('input[type="password"]');
    const form = document.querySelector('form');

    form.addEventListener('submit', function(e) {
      if (passwordField.value && passwordField.value.length < 6) {
        e.preventDefault();
        alert('Password must be at least 6 characters long');
        passwordField.focus();
      }
    });
  });
</script>
</body>
</html>
