<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - TuneWave</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        
        .error-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        .error-icon {
            font-size: 4rem;
            margin-bottom: 24px;
        }
        
        .error-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 16px;
        }
        
        .error-message {
            color: #64748b;
            font-size: 1.1rem;
            margin-bottom: 8px;
            line-height: 1.6;
        }
        
        .error-code {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 32px;
        }
        
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }
        
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        
        .help-text {
            margin-top: 24px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 8px;
            color: #64748b;
            font-size: 0.9rem;
        }
        
        .help-text strong {
            color: #374151;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">🎵</div>
        <h1 class="error-title" th:text="${errorTitle}">Oops! Something went wrong</h1>
        <p class="error-message" th:text="${errorMessage}">We encountered an unexpected error. Please try again.</p>
        <p class="error-code">Error Code: <span th:text="${errorCode}">Unknown</span></p>
        
        <div class="action-buttons">
            <a th:href="@{/}" class="btn btn-primary">🏠 Go to Home</a>
            <a th:href="@{/users/login}" class="btn btn-secondary">🔐 Try Login Again</a>
        </div>
        
        <div class="help-text">
            <strong>Need help?</strong><br>
            If you're having trouble logging in, please reset your password or contact support.
        </div>
    </div>
</body>
</html>
