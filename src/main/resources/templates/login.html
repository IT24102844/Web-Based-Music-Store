<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Login</h2>

    <form th:action="@{/login}" method="post" class="space-y-6">
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" name="email" id="email" required
                   class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" name="password" id="password" required
                   class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition duration-200">
            Login
        </button>
    </form>

    <div th:if="${param.error}" class="mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
        <strong>Login Failed!</strong> Invalid email or password. Please try again.
    </div>
    
    <div th:if="${param.logout}" class="mt-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded">
        <strong>Logout Successful!</strong> You have been logged out successfully.
    </div>
    
    <div th:if="${success}" class="mt-4 p-3 bg-blue-100 border border-blue-400 text-blue-700 rounded">
        <strong>Success!</strong> <span th:text="${success}"></span>
    </div>

    <p class="mt-4 text-center text-sm text-gray-600">
        Don’t have an account?
        <a th:href="@{/users/register}" class="text-blue-600 hover:underline">Register</a>
    </p>
</div>
</body>
</html>
