<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets - Music Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f0f23 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-top: 100px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                    radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                    radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 50px 50px, 80px 80px, 120px 120px;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-family: 'Monospace', monospace;
            font-size: 28px;
            font-weight: 600;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: #e0e0e0;
            text-decoration: none;
            font-weight: 400;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: #00d4ff;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #00d4ff, #0099cc);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .auth-buttons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* User info styling */
        .user-email {
            margin-right: 15px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        /* Logout Button Specific Styling */
        .logout-btn {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid rgba(255, 71, 87, 0.4);
            color: #ff6b81 !important;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            margin-left: 20px;
        }

        .logout-btn:hover {
            background: rgba(255, 71, 87, 0.3);
            border-color: #ff4757;
            color: #ff4757 !important;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
        }

        /* Page Title */
        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #00d4ff, #ffffff, #00d4ff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShimmer 3s ease-in-out infinite;
        }

        @keyframes textShimmer {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* Cards */
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .card-header {
            background: rgba(0, 212, 255, 0.15) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            color: #ffffff;
        }

        .card-body {
            padding: 25px;
            color: #ffffff;
        }

        .card-footer {
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            color: #b0b0b0;
        }

        /* Text Colors */
        .text-muted {
            color: #b0b0b0 !important;
        }

        .text-success {
            color: #2ed573 !important;
        }

        .text-primary {
            color: #00d4ff !important;
        }

        /* Badges */
        .badge {
            border-radius: 10px;
            font-weight: 500;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .bg-success {
            background: rgba(46, 213, 115, 0.2) !important;
            color: #2ed573 !important;
            border: 1px solid rgba(46, 213, 115, 0.3);
        }

        .bg-secondary {
            background: rgba(255, 255, 255, 0.1) !important;
            color: #b0b0b0 !important;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            color: white;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: white;
        }

        /* Alerts */
        .alert {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            color: #ffffff;
            padding: 30px;
            text-align: center;
        }

        .alert-info {
            border-color: rgba(0, 212, 255, 0.4);
            background: rgba(0, 212, 255, 0.1);
        }

        /* Ticket Icons */
        .fa-ticket-alt {
            color: #00d4ff;
        }

        .fa-map-marker-alt, .fa-calendar, .fa-user, .fa-money-bill-wave {
            color: #00d4ff;
            width: 20px;
        }

        /* Ticket Card Specific Styling */
        .ticket-card {
            border-left: 4px solid #00d4ff;
        }

        .ticket-card:hover {
            border-left-color: #2ed573;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                width: 95%;
                padding: 12px 20px;
                flex-wrap: wrap;
                gap: 15px;
            }

            .nav-links {
                display: none;
            }

            .container {
                padding: 20px;
            }

            .auth-buttons {
                flex-wrap: wrap;
                justify-content: center;
            }

            .user-email {
                margin-right: 10px;
                padding: 6px 10px;
                font-size: 0.9rem;
            }

            .logout-btn {
                margin-left: 10px;
                padding: 6px 12px;
                font-size: 0.9rem;
            }

            .page-title {
                font-size: 2rem;
            }

            .card-body {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<!-- Navigation -->
<nav class="navbar">
    <div class="logo">TuneWave</div>
    <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="#">Music</a></li>
        <li><a href="#">Courses</a></li>
        <li><a href="/events">Events</a></li>
        <li><a href="#">Instruments</a></li>
        <li><a href="#">About</a></li>
    </ul>
    <div class="auth-buttons">
        <div th:if="${currentUser != null}" class="d-flex align-items-center">
            <span class="nav-link text-white mb-0 user-email">
                <i class="fas fa-user me-1"></i>
                <span th:text="${currentUser.email}"></span>
            </span>
            <a class="nav-link logout-btn" href="/users/logout">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="page-title">
        <i class="fas fa-ticket-alt me-3"></i>My Tickets
    </h2>

    <!-- No Tickets Message -->
    <div th:if="${#lists.isEmpty(tickets)}" class="text-center py-5">
        <div class="alert alert-info">
            <i class="fas fa-ticket-alt fa-4x mb-4 text-primary"></i>
            <h4>No Tickets Yet</h4>
            <p class="mb-4">You haven't purchased any tickets yet.</p>
            <a href="/events" class="btn btn-primary">
                <i class="fas fa-music me-2"></i>Browse Events
            </a>
        </div>
    </div>

    <!-- Tickets List -->
    <div th:if="${!#lists.isEmpty(tickets)}" class="row g-4">
        <div th:each="ticket : ${tickets}" class="col-lg-6">
            <div class="card h-100 ticket-card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <strong class="text-primary" th:text="${ticket.ticketNumber}">TKT-123</strong>
                    <span th:classappend="${ticket.status == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'"
                          class="badge" th:text="${ticket.status}">ACTIVE</span>
                </div>
                <div class="card-body">
                    <h6 class="mb-3" th:text="${ticket.event.title}">Event Title</h6>

                    <div class="ticket-details">
                        <p class="mb-2 d-flex align-items-center">
                            <i class="fas fa-map-marker-alt me-3"></i>
                            <span th:text="${ticket.event.venue}">Venue</span>
                        </p>
                        <p class="mb-2 d-flex align-items-center">
                            <i class="fas fa-calendar me-3"></i>
                            <span th:text="${ticket.event.date}">Date</span>
                        </p>
                        <p class="mb-2 d-flex align-items-center">
                            <i class="fas fa-user me-3"></i>
                            <span th:text="${ticket.event.artist.stageName}">Artist</span>
                        </p>
                        <p class="mb-0 d-flex align-items-center">
                            <i class="fas fa-money-bill-wave me-3"></i>
                            <span>LKR.<span th:text="${#numbers.formatDecimal(ticket.event.ticketPrice, 1, 2)}">0.00</span></span>
                        </p>
                    </div>
                </div>
                <div class="card-footer text-muted small">
                    <i class="fas fa-clock me-2"></i>
                    Purchased: <span th:text="${#temporals.format(ticket.purchasedAt, 'dd MMM yyyy HH:mm')}">Date</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Statistics Card -->
    <div th:if="${!#lists.isEmpty(tickets)}" class="row mt-5">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <div class="row text-center">
                        <div class="col-md-4">
                            <h3 class="text-primary mb-2" th:text="${#lists.size(tickets)}">0</h3>
                            <p class="text-muted mb-0">Total Tickets</p>
                        </div>
                        <div class="col-md-4">
                            <h3 class="text-success mb-2" th:text="${#lists.size(tickets.?[status == 'ACTIVE'])}">0</h3>
                            <p class="text-muted mb-0">Active Tickets</p>
                        </div>
                        <div class="col-md-4">
                            <h3 class="text-info mb-2" th:text="${#lists.size(tickets.?[status == 'USED'])}">0</h3>
                            <p class="text-muted mb-0">Used Tickets</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
