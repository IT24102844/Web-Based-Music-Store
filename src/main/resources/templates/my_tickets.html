<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Tickets - Music Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="/events">
            <i class="fas fa-music me-2"></i>Music Store
        </a>
        <div class="navbar-nav ms-auto">
                <span class="nav-link text-white">
                    <i class="fas fa-user me-1"></i>
                    <span th:text="${currentUser.email}"></span>
                </span>
            <a class="nav-link" href="/events">Events</a>
            <a class="nav-link" href="/users/logout">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">
        <i class="fas fa-ticket-alt me-2"></i>My Tickets
    </h2>

    <!-- No Tickets Message -->
    <div th:if="${#lists.isEmpty(tickets)}" class="text-center py-5">
        <div class="alert alert-info">
            <i class="fas fa-ticket-alt fa-3x mb-3 text-primary"></i>
            <h4>No Tickets Yet</h4>
            <p>You haven't purchased any tickets yet.</p>
            <a href="/events" class="btn btn-primary">
                <i class="fas fa-music me-1"></i>Browse Events
            </a>
        </div>
    </div>

    <!-- Tickets List -->
    <div th:if="${!#lists.isEmpty(tickets)}" class="row g-4">
        <div th:each="ticket : ${tickets}" class="col-md-6">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <strong th:text="${ticket.ticketNumber}">TKT-123</strong>
                    <span th:classappend="${ticket.status == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'"
                          class="badge" th:text="${ticket.status}">ACTIVE</span>
                </div>
                <div class="card-body">
                    <h6 th:text="${ticket.event.title}">Event Title</h6>
                    <p class="mb-1">
                        <i class="fas fa-map-marker-alt me-2 text-muted"></i>
                        <span th:text="${ticket.event.venue}">Venue</span>
                    </p>
                    <p class="mb-1">
                        <i class="fas fa-calendar me-2 text-muted"></i>
                        <span th:text="${ticket.event.date}">Date</span>
                    </p>
                    <p class="mb-1">
                        <i class="fas fa-user me-2 text-muted"></i>
                        <span th:text="${ticket.event.artist.stageName}">Artist</span>
                    </p>
                    <p class="mb-0">
                        <i class="fas fa-money-bill-wave me-2 text-muted"></i>
                        LKR.<span th:text="${#numbers.formatDecimal(ticket.event.ticketPrice, 1, 2)}">0.00</span>
                    </p>
                </div>
                <div class="card-footer text-muted small">
                    Purchased: <span th:text="${#temporals.format(ticket.purchasedAt, 'dd MMM yyyy HH:mm')}">Date</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
