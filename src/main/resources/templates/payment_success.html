<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Successful - Music Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand" href="/events">
      <i class="fas fa-music me-2"></i>Music Store
    </a>
  </div>
</nav>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card border-success">
        <div class="card-header bg-success text-white text-center">
          <i class="fas fa-check-circle fa-3x mb-3"></i>
          <h3 class="mb-0">Payment Successful!</h3>
        </div>
        <div class="card-body text-center">
          <p class="lead">Thank you for your purchase!</p>

          <!-- Payment Details -->
          <div class="row mb-4">
            <div class="col-md-6">
              <strong>Transaction ID:</strong><br>
              <span th:text="${payment.transactionId}">TXN-123456</span>
            </div>
            <div class="col-md-6">
              <strong>Total Amount:</strong><br>
              <span class="text-success">LKR.<span th:text="${#numbers.formatDecimal(payment.amount, 1, 2)}">0.00</span></span>
            </div>
          </div>

          <!-- Tickets -->
          <h5 class="mb-3">Your Tickets:</h5>
          <div th:each="ticket : ${tickets}" class="alert alert-info mb-2">
            <div class="d-flex justify-content-between align-items-center">
                                <span>
                                    <strong th:text="${ticket.ticketNumber}">TKT-123</strong>
                                    - <span th:text="${payment.event.title}">Event</span>
                                </span>
              <span class="badge bg-success">ACTIVE</span>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="mt-4">
            <a th:href="@{/my-tickets}" class="btn btn-primary me-2">
              <i class="fas fa-ticket-alt me-1"></i>View All My Tickets
            </a>
            <a th:href="@{/events}" class="btn btn-outline-secondary">
              <i class="fas fa-calendar me-1"></i>Browse More Events
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
