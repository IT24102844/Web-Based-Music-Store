<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${song.name} + ' - TuneWave'">Song Details - TuneWave</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f0f23 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: #e0e0e0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding-top: 100px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
              radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
              radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
              radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
      background-size: 50px 50px, 80px 80px, 120px 120px;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px;
    }

    .content-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #00d4ff, #ffffff, #00d4ff);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: textShimmer 3s ease-in-out infinite;
    }

    @keyframes textShimmer {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    .welcome-text {
      color: #b0b0b0;
      margin-bottom: 30px;
      font-size: 1.1rem;
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1200px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .logo {
      font-family: 'Monospace', monospace;
      font-size: 28px;
      font-weight: 600;
      color: #00d4ff;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }

    .auth-buttons {
      display: flex;
      gap: 15px;
    }

    .btn-nav {
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      font-family: 'Roboto', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-login {
      background: transparent;
      color: #e0e0e0;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-login:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #00d4ff;
      color: #00d0ff;
    }

    .btn-signup {
      background: transparent;
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: #ff6b81;
    }

    .btn-signup:hover {
      background: rgba(255, 71, 87, 0.1);
      border-color: #ff4757;
      color: #ff4757;
    }

    /* Song Details Card */
    .song-details-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .song-details-card:hover {
      transform: translateY(-5px);
      border-color: rgba(0, 212, 255, 0.3);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .card-header {
      background: rgba(0, 212, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px 30px;
    }

    .card-header h4 {
      color: #ffffff;
      font-weight: 600;
      margin: 0;
    }

    .card-body {
      padding: 30px;
    }

    /* Song Image */
    .song-cover-image {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .placeholder-container {
      width: 100%;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 156, 204, 0.1));
      border-radius: 12px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
    }

    /* Table Styling */
    .table {
      color: #e0e0e0;
      margin-bottom: 0;
    }

    .table th {
      color: #000000;
      font-weight: 500;
      border: none;
      padding: 12px 15px;
      width: 30%;
    }

    .table td {
      border: none;
      padding: 12px 15px;
      color: #ffffff;
    }

    /* Badge Styling */
    .badge {
      font-size: 0.85em;
      padding: 8px 12px;
      border-radius: 20px;
      font-weight: 500;
    }

    .bg-primary {
      background: linear-gradient(135deg, #00d4ff, #0099cc) !important;
    }

    .bg-success {
      background: linear-gradient(135deg, #28a745, #20c997) !important;
    }

    /* Button Styling */
    .btn {
      border-radius: 10px;
      font-weight: 500;
      transition: all 0.3s ease;
      padding: 10px 20px;
    }

    .btn-warning {
      background: linear-gradient(135deg, #ffc107, #fd7e14);
      border: none;
      color: #000;
    }

    .btn-warning:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 193, 7, 0.3);
      color: #000;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e0e0e0;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      color: #ffffff;
    }

    .btn-outline-primary {
      border: 1px solid rgba(0, 212, 255, 0.5);
      color: #000000;
    }

    .btn-outline-primary:hover {
      background: rgba(0, 212, 255, 0.1);
      border-color: #00d4ff;
      color: #00d4ff;
    }

    .btn-outline-secondary {
      border: 1px solid rgba(0, 255, 255, 0.5);
      color: #000000;
    }

    .btn-outline-secondary:hover {
      background: rgba(0, 212, 255, 0.1);
      border-color: #00d4ff;
      color: #00d4ff;
    }

    /* Audio Player Styling */
    .audio-section {
      margin-top: 30px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .audio-section h6 {
      color: #00d4ff;
      font-weight: 600;
      margin-bottom: 15px;
      font-size: 1.1rem;
    }

    audio {
      width: 100%;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
    }

    audio {
      filter: brightness(0.8) contrast(1.2);
    }

    /* Code Styling */
    code {
      background: rgba(0, 0, 0, 0.01);
      color: #000000;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.9em;
      border: 1px solid rgba(0, 212, 255, 0.2);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .navbar {
        width: 95%;
        padding: 12px 20px;
        flex-wrap: wrap;
        gap: 15px;
      }

      .container {
        padding: 20px;
      }

      .content-container {
        padding: 30px 20px;
      }

      .card-body {
        padding: 20px;
      }

      .table th, .table td {
        padding: 8px 10px;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 576px) {
      .btn-nav {
        padding: 8px 16px;
        font-size: 0.9rem;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar">
  <div class="logo">TuneWave</div>
  <div class="auth-buttons">
    <a th:href="@{/artist/events}" class="btn-nav btn-login">My Events</a>
    <a th:href="@{/artist/event/new}" class="btn-nav btn-login">Create Event</a>
    <a th:href="@{/artist/songs}" class="btn-nav btn-login">My Songs</a>
    <a th:href="@{/users/profile}" class="btn-nav btn-login">Profile</a>
    <a th:href="@{/users/logout}" class="btn-nav btn-signup">Logout</a>
  </div>
</nav>

<div class="container">
  <div class="content-container">
    <h1 th:text="${song.name}">Song Details</h1>
    <p class="welcome-text">Explore the details of your song</p>

    <div class="song-details-card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h4 th:text="${song.name}">Song Name</h4>
        <div>
          <a th:href="@{/artist/songs/edit/{id}(id=${song.id})}" class="btn btn-warning me-2">
            <i class="fas fa-edit me-1"></i>Edit
          </a>
          <a th:href="@{/artist/songs}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-1"></i>Back
          </a>
        </div>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-4 text-center mb-4">
            <div th:if="${song.songImage}">
              <img th:src="@{${song.songImage}}" alt="Song cover" class="song-cover-image">
            </div>
            <div th:unless="${song.songImage}">
              <div class="placeholder-container">
                <div class="text-muted">
                  <i class="fas fa-music fa-5x mb-3" style="color: rgba(255, 255, 255, 0.3);"></i>
                  <p style="color: #b0b0b0;">No image available</p>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-8">
            <table class="table">
              <tr>
                <th>Song Name:</th>
                <td th:text="${song.name}">-</td>
              </tr>
              <tr>
                <th>Genre:</th>
                <td><span class="badge bg-primary" th:text="${song.genre}">-</span></td>
              </tr>
              <tr>
                <th>Price:</th>
                <td><span class="badge bg-success">LKR <span th:text="${#numbers.formatDecimal(song.price, 1, 2)}">0.00</span></span></td>
              </tr>
              <tr>
                <th>Upload Date:</th>
                <td th:text="${#temporals.format(song.uploadDate, 'dd MMMM yyyy')}">-</td>
              </tr>
              <tr>
                <th>Audio File:</th>
                <td>
                  <code th:text="${song.audioFile}">-</code>
                  <a th:href="@{${song.audioFile}}" class="btn btn-sm btn-outline-primary ms-2" download>
                    <i class="fas fa-download me-1"></i>Download
                  </a>
                </td>
              </tr>
              <tr>
                <th>Preview Clip:</th>
                <td>
                  <code th:text="${song.previewClip}">-</code>
                  <a th:href="@{${song.previewClip}}" class="btn btn-sm btn-outline-secondary ms-2" download>
                    <i class="fas fa-download me-1"></i>Download
                  </a>
                </td>
              </tr>
            </table>

            <!-- Audio Player -->
            <div class="audio-section">
              <h6>Preview:</h6>
              <audio controls class="w-100">
                <source th:src="@{${song.previewClip}}" type="audio/mpeg">
                Your browser does not support the audio element.
              </audio>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Add any interactive functionality here
  document.addEventListener('DOMContentLoaded', function() {
    // Add hover effects for the main card
    const card = document.querySelector('.song-details-card');
    card.addEventListener('mouseenter', function() {
      this.style.transform = 'translateY(-5px)';
    });
    card.addEventListener('mouseleave', function() {
      this.style.transform = 'translateY(0)';
    });

    // Enhance audio player appearance
    const audioPlayer = document.querySelector('audio');
    if (audioPlayer) {
      audioPlayer.style.boxShadow = '0 4px 15px rgba(0, 0, 0, 0.2)';
    }
  });
</script>
</body>
</html>
