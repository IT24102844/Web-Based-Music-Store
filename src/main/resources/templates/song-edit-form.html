<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Song - TuneWave</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f0f23 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: #e0e0e0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding-top: 100px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
              radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
              radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
              radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
      background-size: 50px 50px, 80px 80px, 120px 120px;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px;
    }

    .content-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #00d4ff, #ffffff, #00d4ff);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: textShimmer 3s ease-in-out infinite;
    }

    @keyframes textShimmer {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    .welcome-text {
      color: #b0b0b0;
      margin-bottom: 30px;
      font-size: 1.1rem;
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1200px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .logo {
      font-family: 'Monospace', monospace;
      font-size: 28px;
      font-weight: 600;
      color: #00d4ff;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }

    .auth-buttons {
      display: flex;
      gap: 15px;
    }

    .btn-nav {
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      font-family: 'Roboto', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-login {
      background: transparent;
      color: #e0e0e0;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-login:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #00d4ff;
      color: #00d0ff;
    }

    .btn-signup {
      background: transparent;
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: #ff6b81;
    }

    .btn-signup:hover {
      background: rgba(255, 71, 87, 0.1);
      border-color: #ff4757;
      color: #ff4757;
    }

    /* Form Card */
    .form-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .form-card:hover {
      transform: translateY(-5px);
      border-color: rgba(0, 212, 255, 0.3);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .card-header {
      background: rgba(255, 193, 7, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px 30px;
    }

    .card-header h3 {
      color: #ffffff;
      font-weight: 600;
      margin: 0;
    }

    .card-body {
      padding: 30px;
    }

    /* Form Styling */
    .form-label {
      color: #b0b0b0;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
      border-radius: 10px;
      padding: 12px 15px;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(0, 212, 255, 0.5);
      color: #e0e0e0;
      box-shadow: 0 0 0 0.2rem rgba(0, 212, 255, 0.25);
    }

    .form-control::placeholder {
      color: #b0b0b0;
    }

    /* Alert Styling */
    .alert {
      border-radius: 12px;
      border: none;
      backdrop-filter: blur(10px);
    }

    .alert-danger {
      background: rgba(220, 53, 69, 0.2);
      color: #dc3545;
      border: 1px solid rgba(220, 53, 69, 0.3);
    }

    .btn-close {
      filter: invert(1);
    }

    /* Button Styling */
    .btn {
      border-radius: 10px;
      font-weight: 500;
      transition: all 0.3s ease;
      padding: 12px 25px;
    }

    .btn-warning {
      background: linear-gradient(135deg, #ffc107, #fd7e14);
      border: none;
      color: #000;
    }

    .btn-warning:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 193, 7, 0.3);
      color: #000;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e0e0e0;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      color: #ffffff;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .navbar {
        width: 95%;
        padding: 12px 20px;
        flex-wrap: wrap;
        gap: 15px;
      }

      .container {
        padding: 20px;
      }

      .content-container {
        padding: 30px 20px;
      }

      .card-body {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar">
  <div class="logo">TuneWave</div>
  <div class="auth-buttons">
    <a th:href="@{/artist/events}" class="btn-nav btn-login">My Events</a>
    <a th:href="@{/artist/event/new}" class="btn-nav btn-login">Create Event</a>
    <a th:href="@{/artist/songs}" class="btn-nav btn-login">My Songs</a>
    <a th:href="@{/users/profile}" class="btn-nav btn-login">Profile</a>
    <a th:href="@{/users/logout}" class="btn-nav btn-signup">Logout</a>
  </div>
</nav>

<div class="container">
  <div class="content-container">
    <h1>Edit Song</h1>
    <p class="welcome-text">Update your song information</p>

    <div class="form-card">
      <div class="card-header">
        <h3 class="card-title mb-0"><i class="fas fa-edit me-2"></i>Edit Song</h3>
      </div>
      <div class="card-body">
        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
          <span th:text="${error}">Error message</span>
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/artist/songs/edit/{id}(id=${song.id})}" method="post">
          <div class="mb-3">
            <label for="name" class="form-label">Song Name *</label>
            <input type="text" class="form-control" id="name" name="name"
                   th:value="${song.name}" required>
          </div>

          <div class="mb-3">
            <label for="genre" class="form-label">Genre *</label>
            <input type="text" class="form-control" id="genre" name="genre"
                   th:value="${song.genre}" required>
          </div>

          <div class="mb-3">
            <label for="price" class="form-label">Price (LKR) *</label>
            <input type="number" class="form-control" id="price" name="price"
                   th:value="${song.price}" step="0.01" min="0" required>
          </div>

          <!--          <div class="alert alert-info">-->
          <!--            <i class="fas fa-info-circle me-2"></i>-->
          <!--            To update audio files or images, please use the file update feature.-->
          <!--          </div>-->

          <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <a th:href="@{/artist/songs}" class="btn btn-secondary me-md-2">
              <i class="fas fa-times me-1"></i>Cancel
            </a>
            <button type="submit" class="btn btn-warning">
              <i class="fas fa-save me-1"></i>Update Song
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Add any interactive functionality here
  document.addEventListener('DOMContentLoaded', function() {
    // Add hover effects for the form card
    const card = document.querySelector('.form-card');
    card.addEventListener('mouseenter', function() {
      this.style.transform = 'translateY(-5px)';
    });
    card.addEventListener('mouseleave', function() {
      this.style.transform = 'translateY(0)';
    });
  });
</script>
</body>
</html>
